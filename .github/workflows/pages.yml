name: Publier le site sur GitHub Pages

# GitHub Pages sert la branche gh-pages. Ce workflow la garde alignée sur la
# branche par défaut : pousser ici publie le site.
#
# Pourquoi pas actions/deploy-pages : activer Pages par l'API demande une
# permission que le GITHUB_TOKEN n'a pas sur ce dépôt (« Resource not
# accessible by integration »). Pousser une branche ne demande que
# contents: write, dont il dispose.

on:
  push:
    branches: [claude/swiss-supermarket-website-j1t6lk]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aligner gh-pages sur la branche par défaut
        run: git push origin HEAD:gh-pages --force
