name: Publier le site sur GitHub Pages

on:
  push:
    branches: [claude/swiss-supermarket-website-j1t6lk]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; on ne coupe pas celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true active Pages sur le dépôt si ce n'est pas déjà fait.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Site statique : rien à compiler, on publie le dépôt tel quel.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
